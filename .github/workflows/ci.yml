      #   run: |
      #     docker tag devops-ecommerce-backend ${{ secrets.DOCKERHUB_USERNAME }}/devops-ecommerce-backend:latest
      #     docker tag devops-ecommerce-frontend ${{ secrets.DOCKERHUB_USERNAME }}/devops-ecommerce-frontend:latest
