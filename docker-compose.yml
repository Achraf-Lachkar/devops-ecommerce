services:
  db:
    image: mysql:8.0
    container_name: devops_ecommerce_mysql
    restart: always
    environment:
      MYSQL_DATABASE: devops_ecommerce
      MYSQL_USER: ecommerce_user
      MYSQL_PASSWORD: ecommerce_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot_pass"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: devops_ecommerce_backend
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      SECRET_KEY: dev-secret-key-change-me
      DEBUG: "1"
      DB_ENGINE: mysql
      DB_NAME: devops_ecommerce
      DB_USER: ecommerce_user
      DB_PASSWORD: ecommerce_pass
      DB_HOST: db
      DB_PORT: 3306
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: devops_ecommerce_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://127.0.0.1:8000/api
    depends_on:
      - backend

volumes:
  mysql_data:
